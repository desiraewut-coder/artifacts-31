<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artifact Archive</title><style>*{box-sizing:border-box}html,body{margin:0;background:transparent}main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:10px}figure{margin:0;aspect-ratio:3/4;overflow:hidden;border-radius:8px;background:#eee8ef}img{width:100%;height:100%;object-fit:contain;display:block}@media(max-width:600px){main{gap:5px;padding:4px}figure{border-radius:4px}}</style></head><body><main id="gallery" aria-label="Random fantasy artifact illustrations"></main><script>const pictures=[{"file": "images/severance_lens_01.jpg", "name": "Severance Lens"}, {"file": "images/severance_lens_02.jpg", "name": "Severance Lens"}, {"file": "images/severance_lens_03.jpg", "name": "Severance Lens"}, {"file": "images/severance_lens_04.jpg", "name": "Severance Lens"}, {"file": "images/severance_lens_05.jpg", "name": "Severance Lens"}, {"file": "images/veil_needle_01.jpg", "name": "Veil Needle"}, {"file": "images/veil_needle_02.jpg", "name": "Veil Needle"}, {"file": "images/veil_needle_03.jpg", "name": "Veil Needle"}, {"file": "images/black_orbits_01.jpg", "name": "Black Orbits"}, {"file": "images/black_orbits_02.jpg", "name": "Black Orbits"}, {"file": "images/black_orbits_03.jpg", "name": "Black Orbits"}, {"file": "images/world-sunder_blades_01.jpg", "name": "World-Sunder Blades"}, {"file": "images/world-sunder_blades_02.jpg", "name": "World-Sunder Blades"}, {"file": "images/world-sunder_blades_03.jpg", "name": "World-Sunder Blades"}, {"file": "images/mirror_of_unmaking_01.jpg", "name": "Mirror of Unmaking"}, {"file": "images/mirror_of_unmaking_02.jpg", "name": "Mirror of Unmaking"}, {"file": "images/mirror_of_unmaking_03.jpg", "name": "Mirror of Unmaking"}, {"file": "images/chain_of_binding_01.jpg", "name": "Chain of Binding"}, {"file": "images/sepulcher_bell_01.jpg", "name": "Sepulcher Bell"}, {"file": "images/whispering_scarab_01.jpg", "name": "Whispering Scarab"}];let last=[];function shuffle(){const pool=[...pictures];for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}let chosen=pool.filter(p=>!last.includes(p.file)).slice(0,4);if(chosen.length<4)chosen.push(...pool.filter(p=>!chosen.includes(p)).slice(0,4-chosen.length));last=chosen.map(p=>p.file);document.getElementById('gallery').replaceChildren(...chosen.map(p=>{const f=document.createElement('figure'),im=document.createElement('img');im.src=p.file;im.alt=p.name;im.loading='eager';f.append(im);return f}))}shuffle();setInterval(shuffle,120000);</script></body></html>
