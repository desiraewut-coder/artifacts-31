<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artifact Archive — Quiet Ledger</title><style>*{box-sizing:border-box}html,body{margin:0;background:transparent}main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:10px}figure{margin:0;aspect-ratio:3/4;overflow:hidden;border-radius:8px;background:#eee4e5}img{display:block;width:100%;height:100%;object-fit:cover}@media(max-width:600px){main{gap:6px;padding:5px}}@media(prefers-reduced-motion:no-preference){img{animation:appear .5s ease}@keyframes appear{from{opacity:.5}to{opacity:1}}}</style></head><body><main id="gallery" aria-label="Randomized artifact illustrations"></main><script>const files=["ledger_of_secrets_01.png", "ledger_of_secrets_02.png", "ledger_of_secrets_03.png", "awakened_ledger_01.png", "awakened_ledger_02.png", "awakened_ledger_03.png"];const gallery=document.getElementById('gallery');let last=[];function shuffle(){const pool=[...files];for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}let picks=pool.slice(0,4);if(last.length&&picks.every((v,i)=>v===last[i]))picks=picks.slice(1).concat(picks[0]);last=picks;gallery.replaceChildren(...picks.map((name)=>{const f=document.createElement('figure');const im=document.createElement('img');im.src='images/'+name;im.alt=name.replace(/_/g,' ').replace(/\.png$/,'');f.append(im);return f;}));}shuffle();setInterval(shuffle,120000);</script></body></html>
